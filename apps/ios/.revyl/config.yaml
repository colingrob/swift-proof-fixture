project:
    id: caff174e-8ef5-49de-b238-ffaa6413d3b5
session:
    idle_timeout_seconds: 600
build:
    framework: ios
    profiles:
        development:
            ios:
                app_id: 511b100a-8166-4528-8832-612ef4663221
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
        pr-review:
            ios:
                app_id: 511b100a-8166-4528-8832-612ef4663221
                build_commands:
                    - test ! -e ../../ignored-for-revyl-test/sentinel.txt && test ! -e ../../apps/android/sentinel.txt
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
pr_review:
    enabled: true
    review_triggers:
        drafts: false
    build:
        kind: ci_upload_to_revyl
        app_ids:
            ios: 511b100a-8166-4528-8832-612ef4663221
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
    strict_ci_check:
        build: true
